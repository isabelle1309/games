<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111827">
	<title>Bugguesser</title>
	<link rel="stylesheet" href="style/home.css">
	<link rel="stylesheet" href="style/bugguesser.css">
	<link rel="icon" href="images/favicon.ico" type="image/x-icon">
	<script src="script/home-theme.js"></script>
	<script src="script/home-nav.js" defer></script>
	<script type="module" src="script/bugguesser-selector.js"></script>
</head>

<body>
	<header>
		<nav aria-label="Main navigation">
			<a class="brand" href="./index.html">Home</a>
			<div class="menu">
				<details name="nav-menu">
					<summary>Games</summary>
					<div class="dropdown" aria-label="Games menu">
						<a class="dropdown-link" href="bugguesser.html" aria-current="page">Bugguesser</a>
					</div>
				</details>
				<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode">
					<img id="themeIcon" src="images/moon.svg" alt="" aria-hidden="true">
				</button>
			</div>
		</nav>
	</header>
	<main class="game-shell">
		<section class="game-heading" aria-labelledby="gameTitle">
			<h1 id="gameTitle">Who's That Bug?</h1>
			<p class="game-intro" id="gameIntro">Choose a daily challenge from Hollow Knight or Silksong.</p>
		</section>

		<section class="game-picker" aria-label="Choose a game">
			<section class="game-edition" aria-labelledby="hollowKnightTitle">
				<h2 id="hollowKnightTitle">Hollow Knight</h2>
				<img class="game-title-divider" src="images/hk/hk_hr.png" alt="" aria-hidden="true">
				<p>Choose a daily challenge:</p>
				<div class="game-mode-list">
					<div class="game-mode-option">
						<button class="game-mode-button" type="button" data-game-mode="hk-enemies" aria-pressed="false">
							<span>Enemies</span>
							<small class="mode-selection-info" hidden></small>
							<small class="mode-completion-info" hidden>Daily challenge completed</small>
						</button>
						<a class="ready-button mode-play-button" data-play-link href="bugguesser-game.html" hidden>Play</a>
					</div>
					<div class="game-mode-option">
						<button class="game-mode-button" type="button" data-game-mode="hk-npcs" aria-pressed="false">
							<span>NPCs</span>
							<small class="mode-selection-info" hidden></small>
							<small class="mode-completion-info" hidden>Daily challenge completed</small>
						</button>
						<a class="ready-button mode-play-button" data-play-link href="bugguesser-game.html" hidden>Play</a>
					</div>
					<div class="game-mode-option">
						<button class="game-mode-button" type="button" data-game-mode="hk-bosses" aria-pressed="false">
							<span>Bosses</span>
							<small class="mode-selection-info" hidden></small>
							<small class="mode-completion-info" hidden>Daily challenge completed</small>
						</button>
						<a class="ready-button mode-play-button" data-play-link href="bugguesser-game.html" hidden>Play</a>
					</div>
					<div class="game-mode-option">
						<button class="game-mode-button" type="button" data-game-mode="hk-npcs-bosses" aria-pressed="false">
							<span>NPCs &amp; bosses</span>
							<small class="mode-selection-info" hidden></small>
							<small class="mode-completion-info" hidden>Daily challenge completed</small>
						</button>
						<a class="ready-button mode-play-button" data-play-link href="bugguesser-game.html" hidden>Play</a>
					</div>
				</div>
			</section>

			<section class="game-edition" aria-labelledby="silksongTitle">
				<h2 id="silksongTitle">Silksong</h2>
				<img class="game-title-divider" src="images/hk/hkss_hr.png" alt="" aria-hidden="true">
				<p>Silksong character data is not available yet.</p>
				<div class="game-mode-list">
					<button class="game-mode-button" type="button" disabled>
						<span>Enemies</span>
						<small>Coming soon</small>
					</button>
					<button class="game-mode-button" type="button" disabled>
						<span>NPCs</span>
						<small>Coming soon</small>
					</button>
					<button class="game-mode-button" type="button" disabled>
						<span>Bosses</span>
						<small>Coming soon</small>
					</button>
					<button class="game-mode-button" type="button" disabled>
						<span>NPCs &amp; bosses</span>
						<small>Coming soon</small>
					</button>
				</div>
			</section>
		</section>
	</main>
</body>

</html>
